name: codearena3d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codearena3d_backend
    restart: unless-stopped
    ports:
      # Se expone en el puerto 3001 del host para evitar colisión con el puerto 3000 ocupado en la VPS
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://codearena3d.duckdns.org:8080}
    networks:
      - codearena3d_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codearena3d_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Se expone en el puerto 8080 (HTTP) y 8443 (HTTPS) para evitar colisión con puertos ocupados
      - "8080:80"
      - "8443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - codearena3d_net

networks:
  codearena3d_net:
    driver: bridge
